<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Atelier">
<meta name="description" content="Atelier – abgestimmte Foto-Looks für Porträt- und Modelfotos, direkt im Browser.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Atelier</title>
<style>
:root{--bg:#0f0f10;--panel:#161617;--card:#212123;--line:#2c2c2f;--text:#f3f1ec;--mute:#8f8d88;--acc:#c8ad84;--danger:#e0705f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
html{height:100%;background:var(--panel)}
body{position:fixed;top:0;left:0;right:0;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
img{-webkit-user-drag:none}
.th img,#strip img,#view{pointer-events:none}
#view{pointer-events:auto}
body.full header,body.full #sheet,body.full #before,body.full #lookTag,body.full #hint{display:none!important}
body.full #stage{padding:0}
body.full #view{border-radius:0;box-shadow:none}
button,label.ib{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
label.btn{cursor:pointer}
.hidden{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;gap:6px;min-height:54px}
.logo{font-size:13px;font-weight:600;letter-spacing:.34em;padding-left:6px}
.hgrp{display:flex;align-items:center;gap:2px}
.ib{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);position:relative}
.ib:active{background:#ffffff12}
.ib:disabled{opacity:.25}
.ib svg,.btn svg,nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:#111;font-size:10px;font-weight:700;line-height:16px;padding:0 4px}
.btn{padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;color:var(--text)}
.btn.primary{background:var(--text);border-color:var(--text);color:#111}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#111}
.btn.wide{width:100%;justify-content:center;padding:13px}
.btn:active{transform:scale(.97)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:4px 10px}
#view{touch-action:none;border-radius:4px;box-shadow:0 12px 40px #000c;-webkit-touch-callout:none}
.pill{position:absolute;padding:6px 11px;border-radius:999px;background:#000000a6;font-size:12px;font-weight:500;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none;letter-spacing:.01em}
#lookTag{left:18px;bottom:14px}
#before{right:18px;bottom:14px;pointer-events:auto}
#before.on{background:var(--text);color:#111}
#hint{top:12px;left:50%;transform:translateX(-50%);white-space:nowrap}
#flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 24px #000c;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#flash.show{opacity:1}
#busy{position:absolute;top:12px;right:18px;width:16px;height:16px;border-radius:50%;border:2px solid #fff3;border-top-color:#fff;animation:sp .7s linear infinite;opacity:0;transition:opacity .2s;pointer-events:none}
#busy.on{opacity:1}
#ring{position:fixed;border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #0008;pointer-events:none;transform:translate(-50%,-50%);display:none;z-index:5}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:24px;max-width:360px}
.empty .mark{width:56px;height:56px;margin:0 auto 22px;display:block}
.empty h1{font-size:28px;font-weight:600;margin:0 0 12px;letter-spacing:-.02em;line-height:1.15}
.empty p{color:var(--mute);margin:0 0 28px;line-height:1.55;font-size:15px}
.empty small{display:block;color:var(--mute);font-size:12px;margin-top:22px;letter-spacing:.02em}
#sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom)}
#strip{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 2px;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
#strip button{flex:0 0 auto;width:44px;height:56px;border-radius:6px;overflow:hidden;background:var(--card);outline:1.5px solid transparent;outline-offset:1px;padding:0;position:relative}
#strip button.on{outline-color:var(--text)}
#strip img{width:100%;height:100%;object-fit:cover;display:block}
#strip .del{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#000c;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#strip .del svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#strip .mk{position:absolute;right:2px;bottom:2px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
#panel{height:210px;overflow-y:auto;overscroll-behavior:contain;padding-top:4px}
#panel.noscroll{overflow:hidden;touch-action:pan-x}
.row{touch-action:pan-x;overscroll-behavior-x:contain}
.row{display:flex;gap:7px;overflow-x:auto;padding:5px 14px;scrollbar-width:none;align-items:flex-start}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--card);font-size:13px;font-weight:500;color:var(--mute);position:relative;display:inline-flex;align-items:center;gap:6px}
.chip.on{color:#111;background:var(--text)}
.chip .dot,.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.th{flex:0 0 auto;width:74px;text-align:center;font-size:11px;letter-spacing:-.01em;font-weight:500;color:var(--mute);position:relative;overflow:visible}
.th .im{width:74px;height:90px;border-radius:8px;overflow:hidden;background:#222;outline:1.5px solid transparent;outline-offset:2px;margin-bottom:6px;display:flex;align-items:center;justify-content:center}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.on{color:var(--text)}.th.on .im{outline-color:var(--text)}
.th .fav{position:absolute;top:4px;right:4px;font-size:10px;color:var(--acc);text-shadow:0 1px 3px #000}
.th .sb{position:absolute;left:4px;bottom:22px;font-size:10px;padding:1px 5px;border-radius:5px;background:#000b;color:#fff}
.th .plus{font-size:26px;font-weight:300;color:var(--mute)}
.lookbar{display:flex;align-items:center;gap:8px;padding:2px 12px 0 14px}
.lookbar b{font-size:13px;font-weight:600;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.lookbar input{flex:1;min-width:0}
.lookbar #sv{flex:0 0 auto;width:38px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lookbar .tb{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--mute);font-size:15px}
.lookbar .tb.on{color:var(--acc)}
.lookbar .tb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sl{display:grid;grid-template-columns:88px 1fr 32px;align-items:center;gap:10px;padding:0 16px}
.sl label{font-size:13px;color:#d6d3cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .val{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--mute)}
.sl.set .val{color:var(--acc)}
.mini{font-size:12px;color:var(--mute)}
.link{font-size:12px;color:var(--mute);padding:7px 6px;margin-left:auto;flex:0 0 auto}
.tools{display:flex;gap:8px;padding:8px 14px 2px;flex-wrap:wrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:42px;touch-action:none;background:transparent;outline:none;margin:0;--f:50%;--s:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--line) 0,var(--line) min(var(--s),var(--f)),var(--acc) min(var(--s),var(--f)),var(--acc) max(var(--s),var(--f)),var(--line) max(var(--s),var(--f)))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-13px;border-radius:50%;background:#fff;box-shadow:0 2px 10px #000b,0 0 0 1px #0002}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:3px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:0}
nav{display:flex;padding:2px 0 4px;border-top:1px solid var(--line)}
nav button{flex:1;padding:8px 0;font-size:11px;font-weight:500;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.02em}
nav button.on{color:var(--text)}
.ov{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.ovh{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;min-height:54px}
.ovh b{font-size:15px;font-weight:600}
.ovb{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 20px 24px}
.ovb.center{justify-content:center}
#outImg{max-width:100%;max-height:52vh;border-radius:6px;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto;box-shadow:0 12px 40px #000c}
.ovb p{margin:0;color:var(--mute);font-size:13px;text-align:center;line-height:1.5;max-width:340px}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card b{font-size:14px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%;max-width:520px}
.grid div{aspect-ratio:3/4;background:#1a1a1c;overflow:hidden;position:relative}
.grid img{width:100%;height:100%;object-fit:cover;display:block;-webkit-touch-callout:default}
.grid .tag{position:absolute;left:5px;top:5px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--text);color:#111;padding:2px 5px;border-radius:4px}
.grid .tag.n{background:var(--acc)}
.dlgwrap{background:#000a;align-items:center;justify-content:center;padding:20px}
.dlg{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg b{font-size:16px;font-weight:600}
.dlg p{margin:0;color:var(--mute);font-size:13px;line-height:1.45}
.txt{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;outline:none;user-select:text;-webkit-user-select:text}
.txt:focus{border-color:var(--acc)}
.dlg .acts{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(360px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:#111;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
.empty h1{font-size:24px}
.btn.big{padding:14px 30px;font-size:16px}
.link2{display:block;margin-top:18px;font-size:13px;color:var(--mute);cursor:pointer}
#stage{overflow:hidden}
#view{transform-origin:center center;will-change:transform}
#zoomReset{left:50%;bottom:14px;transform:translateX(-50%);pointer-events:auto}
.th .im{position:relative;outline:none!important}
.th.on .im::after{content:"";position:absolute;inset:0;z-index:1;border-radius:8px;box-shadow:inset 0 0 0 2px var(--text);pointer-events:none}
.th .im{transform:translateZ(0)}
.th .lb{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .im:empty{background:linear-gradient(100deg,#202022 30%,#2a2a2d 50%,#202022 70%);background-size:300% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
#strip .own{position:absolute;left:2px;bottom:2px;width:6px;height:6px;border-radius:50%;background:#fff}
#strip .tog{flex:0 0 auto;width:auto;height:56px;padding:0 12px;border-radius:8px;background:var(--card);color:var(--mute);font-size:12px;font-weight:500;outline:none;white-space:nowrap}
#strip .tog.on{background:var(--text);color:#111}
.seg{display:flex;background:var(--card);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--text);color:#111}
.sheetwrap{background:#0009;justify-content:flex-end;transition:background .25s}
.sheetwrap.closing{background:#0000}
.msheet{transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform;touch-action:pan-y}
.msheet.drag{transition:none}
.msheet.off{transform:translateY(100%)}
.msheet .grab{padding:6px 0;box-sizing:content-box;background-clip:content-box}
.msheet{background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:8px 8px calc(12px + env(safe-area-inset-bottom));max-height:80%;overflow:auto}
.msheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.msheet h4{margin:10px 12px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:12px;border-radius:12px;text-align:left;font-size:15px;color:var(--text)}
.mi:active{background:#ffffff0d}
.mi svg{width:20px;height:20px;stroke:var(--acc);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.mi small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.mi.dis{opacity:.35;pointer-events:none}
.grid div.drag{transform:scale(1.06);z-index:2;box-shadow:0 8px 30px #000c;outline:2px solid var(--acc)}
.grid div.over{outline:2px dashed var(--acc);outline-offset:-2px}
.grid .num{position:absolute;right:5px;bottom:5px;font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 3px #000}
.swb{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid transparent;position:relative}
.swb.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel) inset}
.swb.set::after{content:"";position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--text);border:2px solid var(--panel)}
#coach{position:fixed;inset:0;z-index:40}
.chole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.66);transition:all .3s ease;pointer-events:none;border:1.5px solid var(--acc)}
.ccard{position:fixed;left:16px;right:16px;max-width:380px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:top .3s ease;box-shadow:0 12px 40px #000c}
.ccard small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:600}
.ccard b{font-size:17px;font-weight:600}
.ccard p{margin:0;color:#cfccc6;font-size:14px;line-height:1.5}
.fmt{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:8px 10px 6px;border-radius:12px;color:var(--mute);min-width:80px;height:92px}
.fmt span{font-size:13px;font-weight:500}
.fmt small{font-size:10px;opacity:.75;margin-top:-3px;white-space:nowrap}
.fmt .box{border:1.5px solid currentColor;border-radius:3px}
.fmt .box.rnd{border-radius:50%}
.fmt.on{color:var(--text);background:var(--card)}
</style>
</head>
<body>
<header>
  <div class="hgrp">
    <div class="logo" id="logo">ATELIER</div>
    <label class="ib hidden" id="newBtn" for="file" title="Fotos hinzufügen"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2.5"/><circle cx="9" cy="11" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg></label>
    <button class="ib hidden" id="feedBtn" title="Feed planen"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg></button>
    <button class="ib hidden" id="delBtn" title="Foto entfernen"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
  </div>
  <div class="hgrp hidden" id="hist">
    <button class="ib" id="undoBtn" title="Rückgängig" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="ib" id="redoBtn" title="Wiederholen" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>
  <div class="hgrp">
    <button class="ib hidden" id="moreBtn" title="Mehr"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    <button class="btn primary hidden" id="expBtn">Export</button>
  </div>
</header>

<div id="stage">
  <div class="empty" id="empty">
    <svg class="mark" viewBox="0 0 56 56" fill="none" stroke="#c8ad84" stroke-width="1.6"><circle cx="22" cy="28" r="14"/><circle cx="34" cy="28" r="14"/></svg>
    <h1>Looks für deinen Feed.</h1>
    <label class="btn primary big" for="file">Fotos auswählen</label>
    <label class="link2" for="lookFile" id="importLink">Backup oder Look laden</label>
  </div>
  <canvas id="view" class="hidden"></canvas>
  <div class="pill hidden" id="lookTag"></div>
  <button class="pill hidden" id="before">Vorher</button>
  <button class="pill hidden" id="zoomReset">1:1</button>
  <div class="pill hidden" id="hint">Tippen = Vollbild · Halten = Vorher</div>
  <div id="flash"></div>
  <div id="busy"></div>
</div>
<div id="ring"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="feedFile" accept="image/*" multiple hidden>
<input type="file" id="lookFile" accept=".json,application/json,text/plain" hidden>

<div id="sheet" class="hidden">
  <div id="strip" class="hidden"></div>
  <div id="panel"></div>
  <nav id="nav">
    <button data-tab="filter"><svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>Looks</button>
    <button data-tab="adjust"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Anpassen</button>
    <button data-tab="crop"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>Zuschnitt</button>
    <button data-tab="brush"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M12.5 6.5l5 5"/></svg>Retusche</button>
  </nav>
</div>

<div id="modal" class="ov hidden">
  <div class="ovh"><button class="ib" id="closeBtn" title="Zurück"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><b>Export</b><span style="width:40px"></span></div>
  <div class="ovb">
    <img id="outImg" alt="Exportiertes Bild">
    <div class="seg" id="sizeSeg"><button data-s="feed">Feed · 1080 px</button><button data-s="orig">Original</button></div>
    <p id="outInfo"></p>
    <div class="acts">

/* Rendern mit Look/Quelle eines anderen Fotos (Export, Feed) */

/* ================= Sitzung (IndexedDB) ================= */

  ui:{cat:st.cat,tab:st.tab},per:Object.fromEntries(photos.map(p=>[p.id,{look:p.look?lookToStore(p.look):null,match:p.match||null,skin:p.skin||null,rot:p.rot||0,heals:p.heals||[],crop:p.crop||null}]))})};

const toBlobP=(c,t,q)=>new Promise(r=>{try{c.toBlob(r,t,q)}catch(_){r(null)}});

  if(p.masks){for(const k of MASKS)masks[k]=p.masks[k]._u?await toBlobP(p.masks[k],'image/png'):null}else if(p.mb)Object.assign(masks,p.mb);
  p.mb=masks;await DB.set('p:'+p.id,{file:p.file,name:p.name||'',masks})}

  for(const k of MASKS){const b=p.mb[k];if(!b)continue;try{const c=await decode(b,4000),m=p.masks[k],x=m.getContext('2d');x.clearRect(0,0,m.width,m.height);x.drawImage(c,0,0,m.width,m.height);m._u=true}catch(_){}}}

addEventListener('pagehide',()=>saveMeta(true));
async function restoreSession(){
  const m=await DB.get('meta');if(!m||!m.ids||!m.ids.length)return false;restoring=true;busy(true);
  const per=m.per||{};
  for(const id of m.ids){const r=await DB.get('p:'+id);if(!r||!r.file)continue;
    try{const sm=await decode(r.file,360),x=per[id]||{};
      photos.push(newPhoto({id,file:r.file,name:r.name,small:sm,mb:r.masks||null,look:x.look?lookFromStore(x.look):null,match:x.match||null,skin:x.skin||null,rot:x.rot||0,heals:x.heals||[],crop:x.crop||null}))}catch(_){}}

/* ================= Fotos / Stapel ================= */

async function addFiles(list){
  let files=[...list];if(!files.length)return;
  const room=MAXP-photos.length;if(room<=0){toast(`Maximal ${MAXP} Fotos gleichzeitig`);return}
  if(files.length>room){toast(`Maximal ${MAXP} Fotos – ${files.length-room} übersprungen`);files=files.slice(0,room)}
  busy(true);const first=photos.length,firstEver=cur<0;
  for(const f of files){try{const sm=await decode(f,360);const p=newPhoto({file:f.slice(0,f.size,f.type||'image/jpeg'),name:f.name,small:sm});photos.push(p);savePhoto(p)}
    catch(_){toast('Ein Foto konnte nicht gelesen werden')}}
  busy(false);
  if(photos.length>first){if(firstEver)st.cat='Vorschläge';await select(first);
    if(!firstEver&&(gLook.preset||KEYS.some(k=>gLook.adj[k])))toast(`Look „${lookName()}“ übernommen`);

$('#file').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
async function select(i){

  if(cur>=0&&photos[cur]){storeLook();photos[cur].hist=hist;photos[cur].hpos=hpos}
  try{const p=photos[i];srcBase=await decode(p.file,2400);const c=buildSrc(p);cur=i;src=c;if(!p.masks)p.masks=makeMasks(c);await loadMaskBlobs(p)}
  catch(_){busy(false);toast('Foto konnte nicht geöffnet werden');return}
  loadLook(i);const ph=photos[i];if(ph.hist&&ph.hist.length){hist=ph.hist;hpos=Math.min(ph.hpos,hist.length-1);hist[hpos]=snap()}else{hist=[];hpos=-1;commit()}histUI();
  $('#modal').classList.add('hidden');$('#empty').classList.add('hidden');$('#logo').classList.add('hidden');
  ['#view','#sheet','#newBtn','#delBtn','#feedBtn','#moreBtn','#expBtn','#hist','#before'].forEach(s=>$(s).classList.remove('hidden'));
  resetZoom();renderStrip();layout();makeThumbs();setTab(st.tab);showHint();busy(false);saveMeta();
}

    b.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= Look-Vorschläge (Bildanalyse) ================= */
function suggest(c){

  const x=t.getContext('2d',{willReadFrequently:true});x.drawImage(c,0,0,w,h);const d=x.getImageData(0,0,w,h).data,n=w*h;

    L+=l;S+=s;if(l<.22)dark++;if(l>.75)bright++;

    if(s>.28&&l>.2){if(hu>=165&&hu<200)aqua++;else if(hu>=200&&hu<250)blue++;else if(hu>=70&&hu<165)green++;else if(hu>=35&&hu<60&&s>.45)gold++}
    if(l>.6&&s>.4&&hu>=20&&hu<50&&l<.95)warmLights++;
    const cb=128-.168736*r-.331264*g+.5*b,cr=128+.5*r-.418688*g-.081312*b;if(Math.abs(cr-152)<16&&Math.abs(cb-110)<18)skin++;}

  if(f(aqua)>.12){add('Pool Blau',3+f(aqua)*5);add('Teal Film',1.5);add('Sand',1)}
  if(f(blue)>.15){add('Mittelmeer',2.5+f(blue)*4);add('Nordsee',1.2);add('Overcast',S<.25?2:.5)}
  if(f(green)>.2){add('Sommerwiese',2+f(green)*4);add('Park Moody',1.8);add('Olive',1.5)}
  if(f(gold)>.1){add('Herbstgold',2.5+f(gold)*5);add('Golden Hour',1.5)}
  if(L<.3){add('Low Key Gold',2+(.3-L)*6);add('Blitz Abend',f(warmLights)>.01?2.5:1.5);add('Moody',1.2);add('Cinema',1)}
  if(S<.16&&L>.42){add('Studio Grau',2.2);add('Greige',2);add('Clean',L>.6?2:1);add('Beton',1)}
  if(L>.62&&S<.3){add('Hochzeit',1.6);add('Beauty Hell',1.4);add('Clean',1.2)}

  return Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,7).map(e=>+e[0]);
}

$('#feedMenu').onclick=async()=>{if(!feed.length)return;if(await ask({title:'Gespeicherte Posts entfernen?',text:'Entfernt die Vorschaubilder früherer Exporte und hinzugefügter Posts. Deine Fotos bleiben unberührt.',ok:'Entfernen',danger:true})){feed=[];saveFeed();openFeed()}};
$('#feedFile').addEventListener('change',async e=>{const fs=[...e.target.files].slice(0,15);e.target.value='';busy(true);
  for(const f of fs.reverse()){try{const c=await decode(f,600);feed.unshift({id:uid(),u:smallOf(c),e:true});}catch(_){}}if(feed.length>30)feed.length=30;saveFeed();busy(false);openFeed();toast(`${fs.length} Posts hinzugefügt`)});
$('#delBtn').onclick=async()=>{const one=photos.length===1;
  if(await ask({title:one?'Foto schließen?':'Foto aus dem Stapel entfernen?',text:'Das Foto bleibt in deiner Mediathek. Eigene Looks und Favoriten bleiben erhalten.',ok:one?'Schließen':'Entfernen',danger:true}))removePhoto(cur)};

/* ================= Export ================= */
let lastBlob=null,lastURL=null,resFiles=[],resURLs=[],expSize=store.get('at-size','feed');
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/jpeg',.92));
const fname=(i,suf='')=>`atelier-${new Date().toISOString().slice(0,10)}-${String(i+1).padStart(2,'0')}${suf}.jpg`;
async function renderOut(i){const p=photos[i];
  let c0;try{c0=expSize==='orig'?await decodeEdited(p,4600):(i===cur?src:await decodeEdited(p,2400))}catch(_){c0=await decodeEdited(p,2400)}
  return withPhoto(i,c0,()=>{let W,H;const T=cropRect(p,c0.width,c0.height),r=(T.w*c0.width)/(T.h*c0.height);if(expSize==='orig'){W=Math.round(T.w*c0.width);H=Math.round(W/r);const k=Math.min(1,Math.sqrt(16e6/(W*H)));W=Math.round(W*k);H=Math.round(H*k)}else{W=1080;H=Math.round(W/r)}
    const c=document.createElement('canvas');c.width=W;c.height=H;compose(c.getContext('2d',{willReadFrequently:true}),W,H,false);if(c0!==src)c0.width=c0.height=0;return c})}
async function renderBlob(i){
  try{const c=await renderOut(i),b=await toBlob(c);if(!b)throw 0;const r={b,w:c.width,h:c.height,small:smallOf(c)};c.width=c.height=0;return r}
  catch(e){if(expSize==='orig'){expSize='feed';try{const r=await renderBlob(i);r.fallback=true;return r}finally{expSize='orig'}}throw e}}
function sizeUI(){document.querySelectorAll('#sizeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.s===expSize))}
document.querySelectorAll('#sizeSeg button').forEach(b=>b.onclick=()=>{if(expSize===b.dataset.s)return;expSize=b.dataset.s;store.set('at-size',expSize);sizeUI();doExport();vib()});
async function doExport(){
  busy(true);await sleep(30);storeLook();
  let R;try{R=await renderBlob(cur)}catch(_){busy(false);toast('Export fehlgeschlagen – bitte erneut versuchen');return}
  if(lastURL)URL.revokeObjectURL(lastURL);lastURL=URL.createObjectURL(R.b);$('#outImg').src=lastURL;
  let info=`${R.w} × ${R.h} px · ${CS==='display-p3'?'Display P3':'sRGB'} · ${lookName()}`;const r=R.w/R.h,cf=cropOf(photos[cur]);if(cf)info+=' · '+CROPF.find(f=>f.id===cf.fmt).n;else if(r<.75||r>1.91)info+=' · sehr hohe/breite Bilder werden im Feed beschnitten';
  if(R.fallback)info+=' · zu groß für den Speicher, in Feed-Größe exportiert';
  $('#outInfo').textContent=info;addFeed(R.small,false,photos[cur].id);
  lastBlob=R.b;let ok=false;try{ok=!!(navigator.canShare&&navigator.canShare({files:[new File([lastBlob],fname(cur),{type:'image/jpeg'})]}))}catch(_){}
  $('#shareBtn').classList.toggle('hidden',!ok);
  $('#batchCard').classList.toggle('hidden',photos.length<2);$('#bar').classList.add('hidden');
  $('#batchTitle').textContent=`Alle ${photos.length} Fotos exportieren`;$('#allBtn').disabled=false;busy(false);
}
$('#expBtn').onclick=()=>{sizeUI();$('#modal').classList.remove('hidden');$('#outImg').removeAttribute('src');doExport()};
async function saveBlob(blob,name){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(_){}
  if(dl){try{await dl.save({filename:name,data:blob});return true}catch(_){try{await dl.save({filename:name,data:new Uint8Array(await blob.arrayBuffer())});return true}catch(_){return false}}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true;
}
async function shareFiles(files){try{await navigator.share({files});return true}catch(e){if(e.name!=='AbortError')toast('Teilen nicht möglich – Bild lange drücken');return false}}
async function shareOrSave(blob,name,type='image/jpeg'){const f=new File([blob],name,{type});let ok=false;try{ok=!!(navigator.canShare&&navigator.canShare({files:[f]}))}catch(_){}
  if(ok)return shareFiles([f]);if(await saveBlob(blob,name))toast('Gespeichert')}
$('#shareBtn').onclick=()=>shareFiles([new File([lastBlob],fname(cur),{type:'image/jpeg'})]);
$('#dlBtn').onclick=async()=>{if(lastBlob&&await saveBlob(lastBlob,fname(cur)))toast('Gespeichert')};
$('#closeBtn').onclick=()=>$('#modal').classList.add('hidden');
$('#allBtn').onclick=async()=>{
  const btn=$('#allBtn'),bar=$('#bar'),fill=bar.querySelector('i');btn.disabled=true;bar.classList.remove('hidden');storeLook();
  const order=planKeys().filter(k=>k[0]==='p').map(k=>photos.findIndex(p=>'p:'+p.id===k)).filter(i=>i>=0);resURLs.forEach(u=>URL.revokeObjectURL(u));resFiles=[];const urls=resURLs=[];
  for(let n=0;n<order.length;n++){const i=order[n];btn.textContent=`Foto ${n+1} von ${order.length} …`;fill.style.width=(n/order.length*100)+'%';await sleep(20);
    try{const R=await renderBlob(i);resFiles.push(new File([R.b],fname(n),{type:'image/jpeg'}));urls.push(URL.createObjectURL(R.b));addFeed(R.small,false,photos[i].id)}
    catch(_){toast(`Foto ${n+1} übersprungen`)}}
  fill.style.width='100%';btn.textContent='Alle exportieren';btn.disabled=false;
  const g=$('#resGrid');g.innerHTML='';urls.forEach(u=>{const d=document.createElement('div');d.innerHTML=`<img src="${u}" alt="">`;g.appendChild(d)});
  let ok=false;try{ok=!!(navigator.canShare&&navigator.canShare({files:resFiles}))}catch(_){}
  $('#resShare').classList.toggle('hidden',!ok);$('#resTitle').textContent=`${resFiles.length} Fotos fertig`;
  $('#modal').classList.add('hidden');$('#results').classList.remove('hidden');vib();
};
$('#resShare').onclick=()=>shareFiles(resFiles);
$('#resSave').onclick=async()=>{let n=0;for(const f of resFiles){if(await saveBlob(f,f.name))n++;await sleep(350)}toast(`${n} Fotos gespeichert`)};
$('#resClose').onclick=()=>$('#results').classList.add('hidden');

/* Vorher/Nachher-Bild */
async function exportBeforeAfter(){busy(true);await sleep(20);storeLook();
  const r=aspect(),W=1080,H=Math.round(W/r),a=document.createElement('canvas'),b=document.createElement('canvas');a.width=b.width=W;a.height=b.height=H;
  compose(a.getContext('2d',{willReadFrequently:true}),W,H,true);compose(b.getContext('2d',{willReadFrequently:true}),W,H,false);
  const o=a.getContext('2d');o.drawImage(b,W/2,0,W/2,H,W/2,0,W/2,H);o.fillStyle='#fff';o.fillRect(W/2-1.5,0,3,H);
  o.font='600 26px -apple-system,Inter,sans-serif';o.textBaseline='bottom';const lab=(t,x,al)=>{o.textAlign=al;o.shadowColor='#0008';o.shadowBlur=10;o.fillText(t,x,H-28)};
  lab('VORHER',36,'left');lab('NACHHER',W-36,'right');o.shadowBlur=0;
  const blob=await toBlob(a);busy(false);await shareOrSave(blob,fname(cur,'-vorher-nachher'))}
/* Look als LUT (.cube) für Videos */
async function exportCube(){storeLook();const P=params();lutFor(P,LUTS);const d=LUTS.x.getImageData(0,0,LN*LN,LN).data,name=lookName().replace(/[^\wÄÖÜäöüß -]/g,'');
  let s=`TITLE "Atelier ${name}"\nLUT_3D_SIZE ${LN}\nDOMAIN_MIN 0.0 0.0 0.0\nDOMAIN_MAX 1.0 1.0 1.0\n`;
  for(let b=0;b<LN;b++)for(let g=0;g<LN;g++)for(let r=0;r<LN;r++){const i=(g*LN*LN+b*LN+r)*4;s+=`${(d[i]/255).toFixed(5)} ${(d[i+1]/255).toFixed(5)} ${(d[i+2]/255).toFixed(5)}\n`}
  await shareOrSave(new Blob([s],{type:'text/plain'}),`Atelier-${name.replace(/\s+/g,'-')||'Look'}.cube`,'text/plain');lutKey=''}

/* ================= Mehr-Menü ================= */
const IC={skin:'<path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h0"/>',match:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',own:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',plan:'<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/>',
  ba:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/>',cube:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  save:'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>',load:'<path d="M12 21V9M7 14l5-5 5 5"/><path d="M5 3h14"/>'};
function openMenu(){
  const multi=photos.length>1,matched=photos.some(p=>p.match),skinM=photos.some(p=>p.skin),own=photos[cur]&&photos[cur].look;
  const it=(k,t,sub,ic,dis)=>`<button class="mi${dis?' dis':''}" data-a="${k}"><svg viewBox="0 0 24 24">${IC[ic]}</svg><span>${t}<small>${sub}</small></span></button>`;
  $('#msheet').innerHTML='<div class="grab"></div><h4>Stapel</h4>'+
    it(matched?'unmatch':'match',matched?'Angleichung entfernen':'Stapel angleichen',matched?'Helligkeit und Farbe wieder wie aufgenommen':'Helligkeit & Farbe aller Fotos an dieses Foto anpassen','match',!multi)+
    it(skinM?'unskin':'skin',skinM?'Hautton-Angleichung entfernen':'Hautton angleichen',skinM?'Haut wieder wie aufgenommen':'Haut aller Fotos an dieses Foto anpassen','skin',!multi)+
    it('own',own?'Gemeinsamen Look verwenden':'Eigener Look für dieses Foto',own?'Dieses Foto folgt wieder dem Stapel':'Änderungen gelten nur für dieses Foto','own',!multi)+
    it('plan','Feed planen','Reihenfolge im Raster festlegen','plan')+
    '<h4>Teilen & Export</h4>'+
    it('ba','Vorher/Nachher-Bild','Geteiltes Bild als Content','ba')+
    it('cube','Look für Videos (.cube)','Für CapCut, VN, Lightroom & Co.','cube')+
    it('link','Look als Link teilen','Andere können ihn mit einem Tipp übernehmen','link')+
    '<h4>Backup</h4>'+
    it('backup','Looks sichern','Eigene Looks & Favoriten als Datei','save',!customs.length&&!favs.length)+
    it('restore','Looks laden','Backup oder geteilten Look importieren','load')+
    '<h4>Hilfe</h4>'+it('intro','Kurze Einführung','Die wichtigsten Gesten in drei Schritten','help');
  const m=$('#menu'),s=$('#msheet');m.classList.remove('hidden','closing');s.classList.add('off');s.style.transform='';s.scrollTop=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.remove('off')));
}
function closeMenu(){const m=$('#menu'),s=$('#msheet');if(m.classList.contains('hidden'))return;s.style.transform='';s.classList.add('off');m.classList.add('closing');
  setTimeout(()=>{m.classList.add('hidden');m.classList.remove('closing');s.classList.remove('off')},260)}
/* Nach unten wischen schließt das Menü – das Blatt folgt dem Finger */
(()=>{const s=$('#msheet');let y0=null,dy=0,t0=0,armed=false;
  s.addEventListener('touchstart',e=>{if(s.scrollTop>0&&!e.target.closest('.grab')){y0=null;return}y0=e.touches[0].clientY;dy=0;t0=performance.now();armed=false},{passive:true});
  s.addEventListener('touchmove',e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;
    if(!armed){if(dy>6){armed=true;s.classList.add('drag')}else if(dy<-6){y0=null;return}else return}
    e.preventDefault();s.style.transform=`translateY(${Math.max(0,dy)}px)`;$('#menu').style.background=`rgba(0,0,0,${.6*Math.max(0,1-dy/s.offsetHeight)})`},{passive:false});
  const end=()=>{if(y0===null)return;y0=null;s.classList.remove('drag');$('#menu').style.background='';if(!armed)return;
    const v=dy/Math.max(1,performance.now()-t0);if(dy>Math.min(120,s.offsetHeight*.3)||v>.6){closeMenu();vib()}else s.style.transform=''};
  s.addEventListener('touchend',end);s.addEventListener('touchcancel',end);
  /* Maus/Stift (Desktop) */
  s.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||!e.target.closest('.grab'))return;y0=e.clientY;dy=0;t0=performance.now();armed=true;s.classList.add('drag');s.setPointerCapture(e.pointerId)});
  s.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||y0===null)return;dy=e.clientY-y0;s.style.transform=`translateY(${Math.max(0,dy)}px)`});
  s.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')end()});})();
$('#moreBtn').onclick=()=>{openMenu();vib()};
$('#menu').onclick=async e=>{const b=e.target.closest('.mi');if(!b&&e.target.closest('.msheet'))return;closeMenu();if(!b)return;
  ({skin:matchSkin,unskin:unmatchSkin,intro:()=>startIntro(true),match:matchBatch,unmatch:unmatchBatch,own:toggleOwnLook,plan:openFeed,ba:exportBeforeAfter,cube:exportCube,link:()=>shareLook(st.custom&&customs.find(c=>c.id===st.custom)),
    backup:exportBackup,restore:()=>$('#lookFile').click()})[b.dataset.a]()};

/* Drag & Drop (Desktop) */
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

/* Start */
(async()=>{await restoreSession();checkHashLook()})();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(_){}
</script>
